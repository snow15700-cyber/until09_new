            if (!box) { box = document.createElement('div'); box.id = 'errBox';
                box.style.cssText = 'position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));z-index:9999;background:#7f1d1d;color:#fff;font:12px/1.4 monospace;padding:8px 10px;border-radius:8px;white-space:pre-wrap;word-break:break-all';
                (document.body || document.documentElement).appendChild(box); }
            box.textContent += '오류: ' + (e.message || e.target && (e.target.src || e.target.href) || '알 수 없음') + (e.lineno ? ' (줄 ' + e.lineno + ')' : '') + '\n';
        }, true);
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>if (!window.THREE) document.write('<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;font:16px sans-serif;text-align:center;padding:24px;z-index:9999">3D 엔진을 불러오지 못했어요.<br>인터넷 연결을 확인하고 새로고침해 주세요.</div>');</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #0f172a; font-family: 'Inter', sans-serif; overflow: hidden; touch-action: none; }
        #game-container { position: relative; width: 100%; max-width: 600px; height: 100%; margin: 0 auto; background-color: #000; box-shadow: 0 0 30px rgba(0,0,0,0.8); overflow: hidden; }
        #gameCanvas { display: block; width: 100%; height: 100%; transition: filter 0.35s ease; }
        #gameCanvas.grayscale-fx { filter: grayscale(1) contrast(1.1); }
        .no-select { user-select: none; -webkit-user-select: none; }
        .btn-press:active { transform: scale(0.95); background-color: rgba(255, 255, 255, 0.3); }

        /* [iOS 대응] 주소창 높이를 뺀 실제 보이는 높이 사용 + 노치/홈바 안전영역 */
        @supports (height: 100dvh) { body, html { height: 100dvh; } }
        #controls { bottom: calc(1.5rem + env(safe-area-inset-bottom, 0px)) !important; }
        #hud { padding-top: calc(1rem + env(safe-area-inset-top, 0px)); }
        #muteBtn { top: calc(0.75rem + env(safe-area-inset-top, 0px)); }
        #lobbyScreen { padding-top: calc(4rem + env(safe-area-inset-top, 0px)); padding-bottom: calc(2.5rem + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; touch-action: pan-y; }
        /* 길게 눌렀을 때 뜨는 복사/확대 메뉴, 파란 터치 하이라이트 제거 */
        button, canvas { -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
        
        /* Effects */
        @keyframes invincibleGlow { 0% { box-shadow: inset 0 0 10px #60a5fa; } 50% { box-shadow: inset 0 0 40px #3b82f6; } 100% { box-shadow: inset 0 0 10px #60a5fa; } }
        .invincible-overlay { animation: invincibleGlow 0.2s infinite; }
        
        @keyframes shieldGlow { 0% { box-shadow: inset 0 0 10px #34d399; } 50% { box-shadow: inset 0 0 30px #10b981; } 100% { box-shadow: inset 0 0 10px #34d399; } }
        .shield-overlay { animation: shieldGlow 1.5s infinite; }

        @keyframes timeSlowGlow { 0% { box-shadow: inset 0 0 10px #a78bfa; } 50% { box-shadow: inset 0 0 50px #8b5cf6; } 100% { box-shadow: inset 0 0 10px #a78bfa; } }
        .timeslow-overlay { animation: timeSlowGlow 0.5s infinite; }

        /* Custom Scrollbar for Leaderboard */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 10px; }

        /* Popups */
        .toast {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px;
            font-weight: bold; z-index: 100; opacity: 0; transition: opacity 0.3s; pointer-events: none;
            border: 1px solid #4b5563;
        }
        .toast.show { opacity: 1; }

        /* 3-2-1 카운트다운 */
        @keyframes countPop { 0% { transform: scale(2.2); opacity: 0; } 25% { transform: scale(1); opacity: 1; } 80% { opacity: 1; } 100% { transform: scale(0.7); opacity: 0; } }
        .count-pop { animation: countPop 0.5s ease-out forwards; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <!-- 1. 로비 화면 -->
    <div id="lobbyScreen" class="absolute inset-0 flex flex-col items-center justify-start bg-gray-900 bg-opacity-95 z-40 backdrop-blur-md pt-12 overflow-y-auto pb-10">

        <div class="flex items-center gap-2 bg-gray-800 px-4 py-2 rounded-full border border-gray-600 shadow-inner mb-6">
            <span class="text-yellow-400 font-bold">💰 크레딧:</span>

        <!-- 테마 선택 -->

            <div class="flex gap-2 justify-between">
                <button onclick="selectTheme('morning')" id="theme-morning" class="flex-1 py-2 bg-blue-600 text-white rounded-lg font-bold text-sm border-2 border-transparent focus:border-white transition">출근길<br><span class="text-xs font-normal">(쉬움)</span></button>
                <button onclick="selectTheme('evening')" id="theme-evening" class="flex-1 py-2 bg-orange-600 text-white rounded-lg font-bold text-sm border-2 border-transparent focus:border-white transition opacity-50">퇴근길<br><span class="text-xs font-normal">(중간)</span></button>
                <button onclick="selectTheme('night')" id="theme-night" class="flex-1 py-2 bg-green-600 text-white rounded-lg font-bold text-sm border-2 border-transparent focus:border-white transition opacity-50">소풍길<br><span class="text-xs font-normal">(어려움)</span></button>
            </div>
        </div>

        <!-- 차량 선택 -->
        <div class="w-11/12 bg-gray-800 rounded-xl p-4 border border-gray-700 shadow-lg mb-4">
            <h2 class="text-white font-bold mb-3 border-b border-gray-600 pb-1">2. 차량 선택 및 뽑기</h2>

            <!-- 차량 3D 미리보기 (천천히 회전) -->
            <div class="relative w-full h-44 rounded-lg overflow-hidden mb-2 border border-gray-700" style="background: radial-gradient(ellipse at 50% 75%, #3b4a63 0%, #1a2130 60%, #0e131c 100%);">
                <canvas id="previewCanvas" class="w-full h-full block"></canvas>
                <div id="previewLock" class="absolute inset-0 flex items-center justify-center pointer-events-none hidden">
                    <span class="text-5xl drop-shadow-lg">🔒</span>
                </div>
            </div>
            
            <div class="flex items-center justify-between bg-gray-900 rounded-lg p-3 border border-gray-700 mb-3">
                <button onclick="prevCar()" class="text-white text-2xl px-2 active:scale-90">◀</button>
                <div class="text-center">
                    <p id="carName" class="text-lg font-bold text-white mb-1">기본 로드스터</p>
                    <p id="carAbility" class="text-xs text-emerald-400 font-bold bg-gray-800 px-2 py-1 rounded">크레딧 획득 20% 증가</p>
                    <p id="carLockStatus" class="text-xs text-red-400 font-bold mt-1 hidden">🔒 미보유</p>
                </div>
                <button onclick="nextCar()" class="text-white text-2xl px-2 active:scale-90">▶</button>
            </div>

            <button onclick="rollGacha()" class="w-full py-3 bg-gradient-to-r from-yellow-500 to-yellow-600 hover:from-yellow-400 hover:to-yellow-500 text-black font-black rounded-lg shadow-lg transform transition active:scale-95 flex justify-center items-center gap-2">
                🎲 차량 뽑기 (<span id="gachaCostLabel">5</span> C)
            </button>
        </div>

        <button id="startBtn" onclick="initGame()" class="w-11/12 py-4 bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 hover:to-teal-400 text-white font-black rounded-xl text-2xl shadow-[0_0_20px_rgba(16,185,129,0.4)] transform transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
            레이싱 시작
        </button>
    </div>

    <!-- 2. 게임 중 HUD -->
    <div id="hud" class="absolute top-0 left-0 w-full p-4 flex justify-between items-start pointer-events-none hidden z-20">
        <div class="flex flex-col gap-2">

                <span class="text-gray-400 text-xs font-bold mb-1">생존 시간</span>

            <div id="shieldIcon" class="hidden bg-emerald-900 bg-opacity-80 px-2 py-1 rounded border border-emerald-500 text-emerald-300 text-xs font-bold text-center">

            </div>
        </div>
        
        <div class="flex flex-col items-end gap-2">
            <div class="bg-black bg-opacity-60 px-3 py-2 rounded-lg border border-gray-700 flex flex-col items-end backdrop-blur-md">
                <span class="text-gray-400 text-xs font-bold mb-1">SPEED / SCORE</span>
                <div class="flex items-baseline gap-2">
                    <span id="speedDisplay" class="text-red-400 font-mono text-xs font-bold">100km/h</span>
                    <span id="scoreDisplay" class="text-yellow-400 font-mono text-xl font-bold">0</span>
                </div>
            </div>
            
            <!-- 점프 인디케이터 -->
            <div id="jumpContainer" class="flex gap-1 mt-1">
                <div class="jump-dot w-6 h-6 rounded-full bg-blue-600 border border-white flex items-center justify-center text-xs font-bold text-white">J</div>
                <div class="jump-dot w-6 h-6 rounded-full bg-blue-600 border border-white flex items-center justify-center text-xs font-bold text-white">J</div>
                <div class="jump-dot w-6 h-6 rounded-full bg-blue-600 border border-white flex items-center justify-center text-xs font-bold text-white hidden" id="jump3">J</div>
            </div>
        </div>
    </div>
    
    <div id="screenFx" class="absolute inset-0 pointer-events-none hidden z-10"></div>

    <!-- 시작 카운트다운 -->
    <div id="countdown" class="absolute inset-0 flex items-center justify-center pointer-events-none hidden z-30">
        <span id="countText" class="text-white font-black text-9xl" style="text-shadow: 0 0 25px rgba(0,0,0,0.8), 0 4px 0 #000;"></span>
    </div>

    <!-- 캐릭터 잔소리 팝업 -->
    <div id="characterPopup" class="absolute top-20 right-4 flex items-start gap-2 opacity-0 translate-x-10 transition-all duration-500 ease-out pointer-events-none z-30">
        <div class="bg-white bg-opacity-95 text-black p-3 rounded-2xl rounded-tr-none shadow-xl border-2 border-gray-300 text-sm font-black max-w-[180px] break-keep">

        </div>
        <div id="charProfile" class="w-14 h-14 rounded-full border-2 shadow-lg shrink-0 overflow-hidden bg-gray-200 flex items-center justify-center">

        </div>
    </div>

    <!-- 3. 모바일 컨트롤 -->
    <div id="controls" class="absolute bottom-6 left-0 w-full px-4 flex justify-between items-end no-select hidden z-20">

        <div class="flex flex-col items-center gap-2">

                </button>

        </div>

    <button id="muteBtn" onclick="toggleMute()" class="absolute top-3 left-1/2 -translate-x-1/2 z-[60] w-10 h-10 rounded-full bg-black bg-opacity-50 border border-gray-500 text-lg flex items-center justify-center active:scale-90">🔊</button>

<script>
    /* ==========================================
       1. 데이터 구조 및 로컬 스토리지 관리
       ========================================== */
    const CAR_DB = [
        { id: 'roadster', name: '기본 로드스터', model: 'roadster', color: 0xd97706, desc: '크레딧 획득 20% 증가', ability: 'CREDIT_BONUS' },
        { id: 'suv', name: '튼튼한 SUV', model: 'santafe', color: 0x1d4ed8, desc: '충돌 1회 방어 (쉴드)', ability: 'SHIELD' },
        { id: 'light', name: '경량 해치백', model: 'pony', color: 0x10b981, desc: '점프 1회 추가 (총 3회)', ability: 'EXTRA_JUMP' },
        { id: 'drift', name: '드리프트 머신', model: 'sonata', color: 0x8b5cf6, desc: '좌우 이동 속도 3배', ability: 'FAST_MOVE' },
        { id: 'time', name: '타임 컨트롤러', model: 'grandeur', color: 0x333333, desc: '시간 감속 스킬 (점프 불가)', ability: 'TIME_SLOW' }
    ];

    const THEME_DB = {
        morning: { name: '출근길', sky: 0xb9c3cc, fogNear: 35, fogFar: 230, light: 0xf2f0ea, speedMult: 1.0, scoreMult: 1.0, spawnRate: 1.0, windowGlow: 0.0, sun: false },
        evening: { name: '퇴근길', sky: 0xf2a65a, fogNear: 35, fogFar: 230, light: 0xffa850, speedMult: 1.2, scoreMult: 1.2, spawnRate: 1.4, windowGlow: 0.9, sun: true },
        night:   { name: '소풍길', sky: 0xa8dcff, fogNear: 90, fogFar: 420, light: 0xfff4d6, speedMult: 1.7, scoreMult: 1.4, spawnRate: 2.6, nature: true }
    };

    const QUOTES = {
        morning: [
            "이 사원은 언제 오는거야?!", "시간이 몇신데 이제 기어와?!", "나때는 출근 10분전부터 컴퓨터 켜놨어!",
            "오늘 또 지각하면 시말서야!", "김대리도 벌써 도착해서 일하고 있잖아!", "지금 차 막힌다는 핑계 대려는 건 아니지?!",
            "보고서는 다 쓰고 오고 있는건가?", "일찍 일찍 좀 다니자 어?", "자네 자리가 아직 비어있네만.", "뛰어와! 당장!"
        ],
        evening: [
            "오는 길에 우리 애 픽업해와!", "얼른 와서 집에 밀린 설거지해!", "오늘 저녁은 오빠가 하는거 알지?",
            "어디로 새지 말고 바로 집으로 와!", "분리수거 오늘까지야 늦지마!", "마트 들러서 계란 한 판 사와~",
            "왜 이렇게 늦어? 차 막혀?", "빨리 와서 애 씻겨!", "치킨 시켜놨어 식기 전에 와!", "오늘 회사에서 별 일 없었어?"
        ],
        night: [
            "아빠 언제 도착해?", "이러다가 비행기 못 타겠다...", "아빠 미워! 빨리 가!",
            "나 화장실 마려워...", "얼마나 더 가야돼?", "비행기 날아가면 어떡해!",
            "앞에 차 엄청 많네! 다 비켜라!", "아빠 운전 짱 못해~", "빨리 가서 놀고 싶어!", "창밖 구경하니까 재밌다!"
        ]
    };
    
    const CHAR_INFO = {
        morning: { name: "김부장", color: "border-red-500 text-red-600" },
        evening: { name: "와이프", color: "border-pink-500 text-pink-600" },
        night: { name: "우리아이", color: "border-yellow-500 text-yellow-600" }
    };

    let userData = {
        credits: 0,
        ownedCars: ['roadster'],
        highScores: []
    };

    function loadData() {
        try {
            const saved = localStorage.getItem('racingGameData');
            if (saved) userData = Object.assign(userData, JSON.parse(saved));
        } catch (e) {} // 저장소 차단(사생활 보호 모드 등) 시 새 데이터로 시작
        updateLobbyUI();
    }

    function saveData() {
        try { localStorage.setItem('racingGameData', JSON.stringify(userData)); } catch (e) {}
        updateLobbyUI();
    }

    function showToast(msg) {
        const toast = document.getElementById('toastMsg');
        toast.textContent = msg;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    /* ==========================================
       2. 로비 UI 및 가챠 로직
       ========================================== */
    let currentCarIndex = 0;
    let selectedTheme = 'morning';

    function updateLobbyUI() {
        document.getElementById('lobbyCredit').textContent = userData.credits;
        
        const car = CAR_DB[currentCarIndex];
        document.getElementById('carName').textContent = car.name;
        document.getElementById('carAbility').textContent = car.desc;
        
        const isOwned = userData.ownedCars.includes(car.id);
        if (window.previewReady) updatePreviewCar();
        const lockEl = document.getElementById('carLockStatus');
        const startBtn = document.getElementById('startBtn');
        
        if (isOwned) {
            lockEl.classList.add('hidden');
            startBtn.disabled = false;
            startBtn.textContent = "레이싱 시작";
        } else {
            lockEl.classList.remove('hidden');
            startBtn.disabled = true;
            startBtn.textContent = "차량 미보유";
        }

        // 테마 버튼 하이라이트
        ['morning', 'evening', 'night'].forEach(t => {
            const btn = document.getElementById(`theme-${t}`);
            if (t === selectedTheme) {
                btn.classList.remove('opacity-50');
                btn.classList.add('border-white');
            } else {
                btn.classList.add('opacity-50');
                btn.classList.remove('border-white');
            }
        });
    }

    function prevCar() { currentCarIndex = (currentCarIndex - 1 + CAR_DB.length) % CAR_DB.length; updateLobbyUI(); }
    function nextCar() { currentCarIndex = (currentCarIndex + 1) % CAR_DB.length; updateLobbyUI(); }
    function selectTheme(theme) { selectedTheme = theme; updateLobbyUI(); }

    // 베타테스트용 가격 (정식 출시 시 500 / 200으로 되돌리기)
    const GACHA_COST = 5;
    const GACHA_REFUND = 2; // 중복 시 페이백 (비용의 40%)

    function rollGacha() {
        if (userData.credits < GACHA_COST) {
            showToast(`크레딧이 부족합니다! (${GACHA_COST} 필요)`);
            return;
        }
        
        userData.credits -= GACHA_COST;
        playGachaSound();
        
        // 가챠 로직 (랜덤 뽑기)
        const randIndex = Math.floor(Math.random() * CAR_DB.length);
        const rolledCar = CAR_DB[randIndex];

        if (userData.ownedCars.includes(rolledCar.id)) {
            // 중복 시 일부 반환
            userData.credits += GACHA_REFUND;
            showToast(`[중복] ${rolledCar.name} 획득! ${GACHA_REFUND} C 페이백`);
        } else {
            userData.ownedCars.push(rolledCar.id);
            showToast(`🎉 [신규] ${rolledCar.name} 획득!`);
            currentCarIndex = randIndex; // 방금 뽑은 차로 이동
        }
        saveData();
    }


    /* ==========================================
       배경음악 (파일 안에 내장)
       - 출근길/퇴근길/소풍길: 게임 중 반복 재생
       - result: 결과 화면에서 1회 재생
       ========================================== */
    // 음원 위치: 파일 버전은 페이지 안에 내장된 데이터, 웹 링크 버전은 같은 폴더의 audio/*.mp3
    // (예전엔 10MB 음원을 게임 코드 안에 직접 넣어서 아이폰이 코드를 실행하지 못했음)
    const AUDIO_KEYS = ['morning', 'evening', 'night', 'gacha', 'lobby'];
    function audioSrc(k) {
        const el = document.getElementById('aud-' + k);
        if (!el) return 'audio/' + k + '.mp3';
        try {
            const bin = atob(el.textContent.trim());
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            el.textContent = ''; // 메모리 절약
            return URL.createObjectURL(new Blob([bytes], { type: 'audio/mpeg' }));
        } catch (e) { return 'audio/' + k + '.mp3'; }
    }
    const BGM_SRC = {};
    AUDIO_KEYS.forEach(k => BGM_SRC[k] = audioSrc(k));
    const BGM = {};
    Object.entries(BGM_SRC).forEach(([k, src]) => {
        const a = new Audio(src);
        a.loop = (k !== 'gacha');            // 동전(뽑기) 소리는 반복 없이 1회만
        a.volume = (k === 'gacha') ? 0.8 : (k === 'lobby') ? 0.9 : 0.5; // 로비 음악 크게
        a.preload = 'auto';
        BGM[k] = a;
    });
    let isMuted = false;
    try { isMuted = localStorage.getItem('racingMuted') === '1'; } catch (e) {}

    function stopAllMusic() {
        Object.values(BGM).forEach(a => { a.pause(); a.currentTime = 0; });
    }
    // 곡 목록: morning/evening/night = 코스, gacha = 뽑기·결과 화면, lobby = 대기화면(파일 추가 시)
    function playMusic(key) {
        stopAllMusic();
        const a = BGM[key];
        if (!a) return;
        a.loop = (key !== 'gacha');
        a.muted = isMuted;
        const p = a.play();
        if (p && p.catch) p.catch(() => {}); // 브라우저 자동재생 차단 시 조용히 무시
    }
    function toggleMute() {
        isMuted = !isMuted;
        Object.values(BGM).forEach(a => a.muted = isMuted);
        document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
        try { localStorage.setItem('racingMuted', isMuted ? '1' : '0'); } catch (e) {}
    }
    // 뽑기 효과음: 대기화면 음악 위에 한 번 겹쳐서 재생
    function playGachaSound() {
        const a = BGM.gacha; if (!a) return;
        a.loop = false; a.currentTime = 0; a.muted = isMuted;
        const p = a.play(); if (p && p.catch) p.catch(() => {});
    }
    // 대기화면 음악: 브라우저 정책상 첫 터치/클릭/키 입력 후에 재생 가능
    function playLobbyMusic() {
        if (BGM.lobby && BGM.lobby.paused) playMusic('lobby');
    }
    // [iOS 대응] 아이폰 Safari는 '사용자가 터치한 순간'에 한 번 재생된 오디오만
    // 나중에(카운트다운 GO!, 뽑기 등) 코드로 재생할 수 있음.
    // → 첫 터치 때 모든 곡을 소리 없이 한 번씩 재생했다 멈춰서 잠금을 풀어둠
    // 주의: 터치의 pointerdown은 '사용자 동작'으로 인정되지 않아서 touchend/click/keydown만 사용
    let audioUnlocked = false;
    const UNLOCK_EVENTS = ['touchend', 'click', 'keydown'];
    function unlockAudio() {
        if (audioUnlocked) return;
        Object.entries(BGM).forEach(([k, a]) => {
            if (k === 'lobby' && gameState === 'LOBBY') return; // 로비 곡은 바로 진짜 재생
            if (!a.paused) return;
            a.muted = true;
            const p = a.play();
            const reset = () => { a.pause(); a.currentTime = 0; a.muted = isMuted; };
            if (p && p.then) p.then(() => {
                reset();
                if (!audioUnlocked) { audioUnlocked = true; UNLOCK_EVENTS.forEach(ev => window.removeEventListener(ev, unlockAudio, true)); }
            }).catch(() => { a.muted = isMuted; }); // 실패하면 다음 터치에서 다시 시도
            else reset();
        });
        if (gameState === 'LOBBY') playLobbyMusic();
    }
    UNLOCK_EVENTS.forEach(ev => window.addEventListener(ev, unlockAudio, true));

    document.getElementById('muteBtn').textContent = isMuted ? '🔇' : '🔊';
    window.addEventListener('keydown', (e) => { if (e.key === 'm' || e.key === 'M') toggleMute(); });

    function goLobby() {
        stopAllMusic();
        playLobbyMusic();
        document.getElementById('endScreen').classList.add('hidden');
        document.getElementById('lobbyScreen').classList.remove('hidden');
        gameState = 'LOBBY';
        updateLobbyUI();
    }

    /* ==========================================
       3. Three.js 초기화 및 절차적 렌더링

    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, container.clientWidth / container.clientHeight, 0.1, 600);
    
    // 스크린샷 캡처를 위해 preserveDrawingBuffer 활성화
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
    renderer.shadowMap.enabled = true;

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(-50, 30, 20);

    // 환경 구성 (도로, 빌딩 등은 기존 로직 유지, 간소화 적용)
    const NUM_LANES = 4;
    const roadWidth = 24;
    const laneWidth = roadWidth / NUM_LANES;
    const laneCenters = [-laneWidth*1.5, -laneWidth*0.5, laneWidth*0.5, laneWidth*1.5];

    const road = new THREE.Mesh(new THREE.PlaneGeometry(roadWidth, 600), new THREE.MeshStandardMaterial({ color: 0x3a404d }));
    road.rotation.x = -Math.PI / 2; road.position.z = -200; road.receiveShadow = true;
    scene.add(road);

    const markersGroup = new THREE.Group(); scene.add(markersGroup);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for(let l = 1; l <= 3; l++) {
        let x = (l * laneWidth) - (roadWidth/2);
        for(let i = 0; i < 20; i++) {
            let m = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 5), markerMat);
            m.rotation.x = -Math.PI/2; m.position.set(x, 0.05, -i * 15);

    }

    /* ---------- 출근길·퇴근길 도시 배경 ---------- */
    const cityGroup = new THREE.Group(); scene.add(cityGroup);
    const buildings = [];       // 스크롤되는 도시 오브젝트 (건물·신호등·가로등)
    const buildingMats = [];    // 테마별 창문 불빛 조절용

    // 창문 텍스처: 회색조 외벽 + 창문 격자 (색은 material.color로 입힘)
    function makeFacadeTextures() {
        const c = document.createElement('canvas'); c.width = c.height = 64;
        const g = c.getContext('2d');
        const e = document.createElement('canvas'); e.width = e.height = 64;
        const ge = e.getContext('2d');
        g.fillStyle = '#d8d8d8'; g.fillRect(0, 0, 64, 64);      // 외벽
        ge.fillStyle = '#000'; ge.fillRect(0, 0, 64, 64);       // 발광 없음
        for (let row = 0; row < 2; row++) for (let col = 0; col < 2; col++) {
            const x = 6 + col * 32, y = 6 + row * 32;
            g.fillStyle = '#2b3a4a'; g.fillRect(x, y, 20, 22);   // 유리창
            g.fillStyle = 'rgba(255,255,255,0.25)'; g.fillRect(x, y, 20, 5); // 반사
            if (Math.random() < 0.55) { ge.fillStyle = '#fff'; ge.fillRect(x, y, 20, 22); } // 불 켜진 창
        }
        const map = new THREE.CanvasTexture(c), emap = new THREE.CanvasTexture(e);
        [map, emap].forEach(t => { t.wrapS = t.wrapT = THREE.RepeatWrapping; });
        return { map, emap };
    }
    const facadeSets = [makeFacadeTextures(), makeFacadeTextures(), makeFacadeTextures()];
    const wallColors = [0x9aa3ad, 0x7d8794, 0xa89f94, 0x6f7b88, 0xb5b0a8, 0x8c96a3, 0x5f6b78];
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x55595f });

    function makeBuilding(w, h, d) {
        const set = facadeSets[Math.floor(Math.random() * facadeSets.length)];
        const map = set.map.clone(), emap = set.emap.clone();
        map.needsUpdate = emap.needsUpdate = true;
        // 창문 한 칸 = 약 3.5m
        map.repeat.set(Math.max(1, Math.round(d / 7)), Math.max(1, Math.round(h / 7)));
        emap.repeat.copy(map.repeat);
        const side = new THREE.MeshStandardMaterial({
            color: wallColors[Math.floor(Math.random() * wallColors.length)], map, roughness: 0.8,
            emissive: 0xffc46b, emissiveMap: emap, emissiveIntensity: 0
        });
        buildingMats.push(side);
        // 박스 면 순서: +x, -x, +y, -y, +z, -z → 위/아래는 지붕색
        const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [side, side, roofMat, roofMat, side, side]);
        b.position.y = h / 2;
        return b;
    }

    // 인도 + 연석 (고정)
    const sidewalkMat = new THREE.MeshStandardMaterial({ color: 0x9a9a96 });
    const curbMat = new THREE.MeshStandardMaterial({ color: 0xcfcfc8 });
    [-1, 1].forEach(sd => {
        const sw = new THREE.Mesh(new THREE.BoxGeometry(5, 0.3, 900), sidewalkMat);
        sw.position.set(sd * (roadWidth/2 + 2.5), 0.15, -300); cityGroup.add(sw);
        const curb = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 900), curbMat);
        curb.position.set(sd * (roadWidth/2 + 0.2), 0.2, -300); cityGroup.add(curb);
        const ground = new THREE.Mesh(new THREE.PlaneGeometry(300, 900), new THREE.MeshStandardMaterial({ color: 0x5c6066 }));
        ground.rotation.x = -Math.PI/2; ground.position.set(sd * (roadWidth/2 + 155), -0.02, -300); cityGroup.add(ground);
    });

    // 빼곡한 건물: 도로 쪽 앞줄(빈틈 거의 없음) + 뒷줄 고층
    [-1, 1].forEach(sd => {
        let z = -400;
        while (z < 50) {
            const d = 9 + Math.random() * 5, w = 10 + Math.random() * 6, h = 22 + Math.random() * 45;
            const b = makeBuilding(w, h, d);
            b.position.set(sd * (roadWidth/2 + 5 + w/2), h/2, z + d/2);
            cityGroup.add(b); buildings.push(b);
            z += d + 0.6;
        }
        for (let z2 = -400; z2 < 50; z2 += 16) {
            const d = 12 + Math.random() * 4, w = 14, h = 60 + Math.random() * 70;
            const b = makeBuilding(w, h, d);
            b.position.set(sd * (roadWidth/2 + 26 + Math.random() * 6), h/2, z2);
            cityGroup.add(b); buildings.push(b);
        }
    });

    // 신호등 + 횡단보도 (도로 위로 팔이 뻗은 형태)
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x3b3f45, metalness: 0.5, roughness: 0.5 });
    const housingMat = new THREE.MeshStandardMaterial({ color: 0x1b1d20 });
    const lampOff = new THREE.MeshStandardMaterial({ color: 0x333333 });
    const lampOn = {
        red: new THREE.MeshBasicMaterial({ color: 0xff2a2a }),
        yellow: new THREE.MeshBasicMaterial({ color: 0xffc21a }),
        green: new THREE.MeshBasicMaterial({ color: 0x22e07a })
    };
    const zebraMat = new THREE.MeshBasicMaterial({ color: 0xf2f2f2 });
    const trafficLights = [];
    function makeTrafficLight(sd) {
        const g = new THREE.Group();
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.28, 8, 8), poleMat);
        pole.position.set(sd * (roadWidth/2 + 1.2), 4, 0); g.add(pole);
        const armLen = 9;
        const arm = new THREE.Mesh(new THREE.BoxGeometry(armLen, 0.25, 0.25), poleMat);
        arm.position.set(sd * (roadWidth/2 + 1.2 - armLen/2), 7.8, 0); g.add(arm);
        // 가로형 신호등 (빨/노/초)
        const housing = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.1, 0.7), housingMat);
        const hx = sd * (roadWidth/2 + 1.2 - armLen + 1.8);
        housing.position.set(hx, 7.2, 0); g.add(housing);
        const lamps = {};
        ['red', 'yellow', 'green'].forEach((k, i) => {
            const l = new THREE.Mesh(new THREE.CircleGeometry(0.38, 12), lampOff);
            l.position.set(hx + (i - 1) * 1.0, 7.2, 0.36); g.add(l); lamps[k] = l;
        });
        // 보행자 신호등 기둥 꼭대기 작은 박스
        const ped = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.0, 0.5), housingMat);
        ped.position.set(sd * (roadWidth/2 + 1.2), 3.2, 0.4); g.add(ped);
        const tl = { group: g, lamps, state: ['red', 'yellow', 'green'][Math.floor(Math.random()*3)], timer: Math.random() * 3 };
        setLight(tl);
        trafficLights.push(tl);
        return g;
    }
    function setLight(tl) {
        Object.entries(tl.lamps).forEach(([k, m]) => { m.material = (k === tl.state) ? lampOn[k] : lampOff; });
    }
    function tickTrafficLights(dt) {
        trafficLights.forEach(tl => {
            tl.timer -= dt;
            if (tl.timer <= 0) {
                tl.state = tl.state === 'green' ? 'yellow' : tl.state === 'yellow' ? 'red' : 'green';
                tl.timer = tl.state === 'yellow' ? 1 : 3 + Math.random() * 2;
                setLight(tl);
            }
        });
    }
    for (let z = -400, k = 0; z < 50; z += 75, k++) {
        const cross = new THREE.Group();
        cross.add(makeTrafficLight(k % 2 ? 1 : -1)); // 좌우 번갈아

            cross.add(st);
        }
        cross.position.z = z;
        cityGroup.add(cross); buildings.push(cross);
    }

    // 가로등
    const lampHeadMat = new THREE.MeshStandardMaterial({ color: 0xfff1c9, emissive: 0xffd27a, emissiveIntensity: 0 });
    for (let z = -400; z < 50; z += 30) {
        [-1, 1].forEach(sd => {
            const g = new THREE.Group();
            const p = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.15, 6, 6), poleMat);
            p.position.set(sd * (roadWidth/2 + 3.8), 3, 0);
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.25, 0.6), lampHeadMat);
            head.position.set(sd * (roadWidth/2 + 3.1), 6, 0);
            g.add(p, head); g.position.z = z + (sd === 1 ? 15 : 0);
            cityGroup.add(g); buildings.push(g);
        });
    }

    // 퇴근길 노을 해
    const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(28, 24, 16), new THREE.MeshBasicMaterial({ color: 0xff8a3d, fog: false }));
    sunMesh.position.set(0, 34, -560); sunMesh.visible = false; scene.add(sunMesh);




    /* ---------- 소풍길 자연 배경 (나무·산·강·꽃) ---------- */
    const natureGroup = new THREE.Group(); natureGroup.visible = false; scene.add(natureGroup);
    const natureScrollers = []; // 도로와 함께 흘러가는 오브젝트

    // 잔디 바닥 (도로 양옆)
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x7ccf5a });
    [-1, 1].forEach(side => {
        const g = new THREE.Mesh(new THREE.PlaneGeometry(300, 900), grassMat);
        g.rotation.x = -Math.PI/2; g.position.set(side * (roadWidth/2 + 150), -0.02, -300);
        natureGroup.add(g);
    });
    // 강 (오른쪽, 도로와 나란히) + 강둑 모래
    const sand = new THREE.Mesh(new THREE.PlaneGeometry(18, 900), new THREE.MeshStandardMaterial({ color: 0xe8d9a0 }));
    sand.rotation.x = -Math.PI/2; sand.position.set(27, 0.0, -300); natureGroup.add(sand);
    const river = new THREE.Mesh(new THREE.PlaneGeometry(13, 900), new THREE.MeshStandardMaterial({ color: 0x3fa9f5, roughness: 0.1, metalness: 0.3 }));
    river.rotation.x = -Math.PI/2; river.position.set(27, 0.03, -300); natureGroup.add(river);
    // 물결 반짝임 (흘러감)
    const rippleMat = new THREE.MeshBasicMaterial({ color: 0xdff4ff });
    for (let z = -400; z < 50; z += 18) {
        const r = new THREE.Mesh(new THREE.PlaneGeometry(1.5 + Math.random()*2, 0.25), rippleMat);
        r.rotation.x = -Math.PI/2; r.position.set(22 + Math.random()*10, 0.06, z);
        natureGroup.add(r); natureScrollers.push(r);
    }

    // 산 (멀리, 고정 — 멀어서 움직임이 거의 없어 보임)
    const mountainMats = [0x6aa46a, 0x7fb48a, 0x5d9470].map(c => new THREE.MeshStandardMaterial({ color: c, flatShading: true }));
    const snowMat = new THREE.MeshStandardMaterial({ color: 0xffffff, flatShading: true });
    for (let i = 0; i < 14; i++) {
        const side = i % 2 ? 1 : -1;
        const h = 50 + Math.random() * 70, r = 40 + Math.random() * 40;
        const m = new THREE.Mesh(new THREE.ConeGeometry(r, h, 6), mountainMats[i % 3]);
        const x = side * (70 + Math.random() * 100), z = -230 - Math.random() * 110;
        m.position.set(x, h/2 - 2, z); natureGroup.add(m);
        if (h > 85) { // 높은 산엔 눈 덮인 봉우리
            const cap = new THREE.Mesh(new THREE.ConeGeometry(r * 0.28, h * 0.28, 6), snowMat);
            cap.position.set(x, h - h*0.14 - 2 + 0.3, z); natureGroup.add(cap);

    // 나무 (침엽수 + 둥근 활엽수)
    const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b });
    const leafMats = [0x2f8f3a, 0x3fae4a, 0x58c45a].map(c => new THREE.MeshStandardMaterial({ color: c, flatShading: true }));
    function makeTree() {
        const t = new THREE.Group();
        const s = 0.8 + Math.random() * 0.8;
        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.35*s, 0.45*s, 3*s, 6), trunkMat);
        trunk.position.y = 1.5*s; t.add(trunk);
        const leaf = leafMats[Math.floor(Math.random()*3)];
        if (Math.random() < 0.5) {
            [0, 1.6, 3.0].forEach((y, k) => {
                const c = new THREE.Mesh(new THREE.ConeGeometry((2.6 - k*0.6)*s, 3*s, 7), leaf);
                c.position.y = (3.5 + y)*s; t.add(c);
            });
        } else {
            const ball = new THREE.Mesh(new THREE.IcosahedronGeometry(2.4*s, 0), leaf);
            ball.position.y = 4.5*s; t.add(ball);
        }
        return t;
    }
    for (let z = -400; z < 50; z += 9) {
        // 왼쪽 숲
        for (let k = 0; k < 2; k++) {
            const t = makeTree(); t.position.set(-(17 + Math.random()*28), 0, z + Math.random()*8);
            natureGroup.add(t); natureScrollers.push(t);
        }
        // 강 건너편 나무
        if (Math.random() < 0.7) {
            const t = makeTree(); t.position.set(38 + Math.random()*20, 0, z + Math.random()*8);
            natureGroup.add(t); natureScrollers.push(t);
        }
    }

    // 꽃 (도로 가장자리 + 들판)
    const petalColors = [0xff5fa2, 0xffd84a, 0xffffff, 0xff7b54, 0xb388ff];
    const petalMats = petalColors.map(c => new THREE.MeshStandardMaterial({ color: c }));
    const stemMat = new THREE.MeshStandardMaterial({ color: 0x3a8f2f });
    const petalGeo = new THREE.SphereGeometry(0.35, 6, 5);
    const stemGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.6, 4);
    for (let z = -400; z < 50; z += 3) {
        [-1, 1].forEach(side => {
            if (side === 1 && Math.random() < 0.4) return; // 오른쪽은 강 쪽이라 조금 적게
            const f = new THREE.Group();
            const stem = new THREE.Mesh(stemGeo, stemMat); stem.position.y = 0.3;
            const head = new THREE.Mesh(petalGeo, petalMats[Math.floor(Math.random()*petalMats.length)]); head.position.y = 0.7;
            f.add(stem, head);
            const x = side === -1 ? -(13 + Math.random()*4) : (13 + Math.random()*4);
            f.position.set(x, 0, z + Math.random()*3);
            natureGroup.add(f); natureScrollers.push(f);
        });
    }

    // 배경 스크롤 (도시/자연 공통)
    function scrollEnvironment(dist) {
        if (cityGroup.visible) tickTrafficLights(1/60);
        buildings.forEach(b => { b.position.z += dist; if (b.position.z > 50) b.position.z -= 450; });
        if (natureGroup.visible) natureScrollers.forEach(o => { o.position.z += dist; if (o.position.z > 50) o.position.z -= 450; });
    }

    /* ==========================================
       차량 모델 (앞 = -z, 뒤 = +z)
       차종별 템플릿을 한 번 만들고 복제해서 사용 (지오메트리 공유)
       ========================================== */
    const CARMAT = {
        glass:  new THREE.MeshStandardMaterial({ color: 0x1c2a38, metalness: 0.6, roughness: 0.15 }),
        tire:   new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.9 }),
        rim:    new THREE.MeshStandardMaterial({ color: 0xc8ccd2, metalness: 0.9, roughness: 0.25 }),
        darkRim:new THREE.MeshStandardMaterial({ color: 0x2a2a2e, metalness: 0.7, roughness: 0.3 }),
        chrome: new THREE.MeshStandardMaterial({ color: 0xe6e6e6, metalness: 1.0, roughness: 0.15 }),
        gold:   new THREE.MeshStandardMaterial({ color: 0xf5c542, metalness: 1.0, roughness: 0.25 }),
        black:  new THREE.MeshStandardMaterial({ color: 0x18181b, roughness: 0.6 }),
        plastic:new THREE.MeshStandardMaterial({ color: 0x2b2d31, roughness: 0.8 }),
        seat:   new THREE.MeshStandardMaterial({ color: 0x5a2e1a, roughness: 0.7 }),
        white:  new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.4 }),
        head:   new THREE.MeshBasicMaterial({ color: 0xfff6d5 }),
        tail:   new THREE.MeshBasicMaterial({ color: 0xff2a2a }),
        plate:  new THREE.MeshStandardMaterial({ color: 0xf0f0f0 }),
        neonPurple: new THREE.MeshBasicMaterial({ color: 0xc084fc, transparent: true, opacity: 0.55, depthWrite: false }),
        neonCyan:   new THREE.MeshBasicMaterial({ color: 0x22d3ee }),
        neonCyanGlow: new THREE.MeshBasicMaterial({ color: 0x22d3ee, transparent: true, opacity: 0.45, depthWrite: false }),
        orange: new THREE.MeshBasicMaterial({ color: 0xff9a1f })
    };
    const PAINT_PLACEHOLDER = new THREE.MeshStandardMaterial({ color: 0xffffff });
    const ACCENT_PLACEHOLDER = new THREE.MeshStandardMaterial({ color: 0xffffff });

    // bw/bl/bh: 차체 폭/길이/높이, cy: 차체 중심 높이, wr: 바퀴 반지름 (충돌 판정은 bw·bl 사용)
    const CAR_SPECS = {
        roadster: { bw:2.3, bl:4.4, bh:0.55, cy:0.62, wr:0.38 },
        santafe:  { bw:2.6, bl:4.9, bh:1.1,  cy:1.0,  wr:0.52 },
        pony:     { bw:2.1, bl:3.9, bh:0.75, cy:0.72, wr:0.36 },
        sonata:   { bw:2.5, bl:5.0, bh:0.5,  cy:0.55, wr:0.42 },
        grandeur: { bw:2.5, bl:5.4, bh:0.72, cy:0.76, wr:0.43 }
    };

    function buildCarTemplate(type) {
        const car = new THREE.Group();
        const s = CAR_SPECS[type] || CAR_SPECS.pony;
        const { bw, bl, bh, cy, wr } = s;
        const top = cy + bh / 2;   // 차체 윗면 높이
        const front = -bl / 2, back = bl / 2;
        const box = (w, h, d, mat, x, y, z, parent = car) => {
            const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            m.position.set(x, y, z); parent.add(m); return m;
        };
        const paint = PAINT_PLACEHOLDER, accent = ACCENT_PLACEHOLDER;

        // ---- 공통: 차체 ----
        box(bw, bh, bl, paint, 0, cy, 0);

        // ---- 공통: 바퀴 (타이어 + 휠) ----
        const axle = bl * 0.31;
        const tireW = (type === 'santafe' || type === 'sonata') ? 0.42 : 0.32;
        const rimMat = (type === 'sonata' || type === 'grandeur') ? CARMAT.darkRim : CARMAT.rim;
        const tireGeo = new THREE.CylinderGeometry(wr, wr, tireW, 18);
        const rimGeo = new THREE.CylinderGeometry(wr * 0.6, wr * 0.6, tireW + 0.02, 10);
        [[-1, axle], [1, axle], [-1, -axle], [1, -axle]].forEach(([sx, z]) => {
            const x = sx * (bw / 2 + (type === 'sonata' ? 0.08 : -0.02));
            const t = new THREE.Mesh(tireGeo, CARMAT.tire); t.rotation.z = Math.PI / 2; t.position.set(x, wr, z); car.add(t);
            const r = new THREE.Mesh(rimGeo, rimMat); r.rotation.z = Math.PI / 2; r.position.set(x, wr, z); car.add(r);
        });

        // ---- 공통: 라이트·번호판·사이드미러 ----
        const lightY = cy + bh * 0.15;
        if (type !== 'grandeur') {
            [-1, 1].forEach(sd => {
                box(0.5, 0.18, 0.06, CARMAT.head, sd * (bw / 2 - 0.4), lightY, front - 0.03);
                box(0.45, 0.18, 0.06, CARMAT.tail, sd * (bw / 2 - 0.35), lightY, back + 0.03);
            });
        }
        box(0.7, 0.22, 0.04, CARMAT.plate, 0, cy - bh * 0.15, back + 0.04);
        // 범퍼
        box(bw * 0.98, 0.18, 0.2, type === 'santafe' ? CARMAT.plastic : CARMAT.black, 0, cy - bh / 2 + 0.12, back + 0.05);
        box(bw * 0.98, 0.18, 0.2, type === 'santafe' ? CARMAT.plastic : CARMAT.black, 0, cy - bh / 2 + 0.12, front - 0.05);

        const mirrors = (z, y) => [-1, 1].forEach(sd => box(0.3, 0.16, 0.12, paint, sd * (bw / 2 + 0.12), y, z));

        if (type === 'roadster') {
            // 기본 로드스터 (크레딧 보너스): 지붕 없는 오픈카 + 금색 트림 + 크롬 디테일
            box(bw * 0.86, 0.06, 0.08, CARMAT.chrome, 0, top + 0.42, -0.35);                  // 앞유리 프레임 위
            const ws = box(bw * 0.84, 0.75, 0.05, CARMAT.glass, 0, top + 0.05, -0.35); ws.rotation.x = -0.45; // 앞유리 (기울어짐)
            ws.position.y = top + 0.3;
            box(bw * 0.8, 0.12, 1.5, CARMAT.black, 0, top + 0.02, 0.6);                        // 실내 바닥
            [-1, 1].forEach(sd => {
                box(0.65, 0.3, 0.55, CARMAT.seat, sd * 0.45, top + 0.2, 0.75);                 // 가죽 시트
                box(0.65, 0.6, 0.15, CARMAT.seat, sd * 0.45, top + 0.38, 1.05);                // 등받이
                box(0.12, 0.65, 0.12, CARMAT.chrome, sd * 0.45, top + 0.4, 1.3);               // 롤바 기둥
            });
            box(1.05, 0.12, 0.12, CARMAT.chrome, 0, top + 0.72, 1.3);                          // 롤바
            const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.2, 0.04, 6, 14), CARMAT.black);
            wheel.position.set(-0.45, top + 0.38, 0.15); wheel.rotation.x = -0.6; car.add(wheel);
            [-1, 1].forEach(sd => box(0.04, 0.08, bl * 0.85, CARMAT.gold, sd * (bw / 2 + 0.01), cy + bh * 0.25, 0)); // 금색 사이드 라인
            box(0.5, 0.06, 0.04, CARMAT.gold, 0, cy + bh * 0.25, front - 0.04);               // 금색 엠블럼
            box(bw * 0.5, 0.18, 0.05, CARMAT.chrome, 0, cy - 0.02, front - 0.04);              // 크롬 그릴
            [-1, 1].forEach(sd => { const ex = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.3, 8), CARMAT.chrome); ex.rotation.x = Math.PI/2; ex.position.set(sd * 0.5, cy - bh/2 + 0.05, back + 0.12); car.add(ex); });
            mirrors(-0.2, top + 0.2);
        }
        else if (type === 'santafe') {
            // 튼튼한 SUV (쉴드): 각진 캐빈 + 범퍼가드 + 펜더 + 루프랙 + 스페어 타이어
            const cl = 3.3, ch = 0.95, cz = 0.35;
            box(bw * 0.9, ch, cl, paint, 0, top + ch / 2, cz);                                 // 캐빈 (차체색)
            [-1, 1].forEach(sd => box(0.04, ch * 0.62, cl * 0.86, CARMAT.glass, sd * (bw * 0.45 + 0.02), top + ch * 0.55, cz)); // 옆 유리
            box(bw * 0.8, ch * 0.6, 0.04, CARMAT.glass, 0, top + ch * 0.55, cz - cl / 2 - 0.02); // 앞 유리
            box(bw * 0.8, ch * 0.5, 0.04, CARMAT.glass, 0, top + ch * 0.6, cz + cl / 2 + 0.02);  // 뒷 유리
            // 루프랙 (레일 + 가로대)
            [-1, 1].forEach(sd => box(0.1, 0.12, cl * 0.9, CARMAT.black, sd * bw * 0.38, top + ch + 0.08, cz));
            [-0.8, 0.2, 1.2].forEach(z => box(bw * 0.8, 0.07, 0.1, CARMAT.black, 0, top + ch + 0.16, cz + z));
            // 범퍼 가드 (불바)
            box(bw * 0.7, 0.12, 0.12, CARMAT.chrome, 0, cy + 0.15, front - 0.35);
            box(bw * 0.7, 0.12, 0.12, CARMAT.chrome, 0, cy - 0.35, front - 0.35);
            [-1, 1].forEach(sd => box(0.12, 0.65, 0.12, CARMAT.chrome, sd * bw * 0.32, cy - 0.1, front - 0.35));
            // 펜더 오버휀더 + 사이드 스텝 + 하부 보호판
            [-1, 1].forEach(sd => {
                [axle, -axle].forEach(z => box(0.18, 0.25, 1.4, CARMAT.plastic, sd * (bw / 2 + 0.06), wr * 2 + 0.05, z));
                box(0.35, 0.08, bl * 0.4, CARMAT.chrome, sd * (bw / 2 + 0.15), 0.55, 0);
            });
            box(bw * 0.6, 0.08, 0.6, CARMAT.rim, 0, cy - bh / 2 - 0.02, front + 0.3);
            // 뒤 스페어 타이어
            const sp = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 0.3, 18), CARMAT.tire);
            sp.rotation.x = Math.PI / 2; sp.position.set(0, cy + 0.15, back + 0.2); car.add(sp);
            const spc = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.32, 10), accent);
            spc.rotation.x = Math.PI / 2; spc.position.copy(sp.position); car.add(spc);
            // 루프 위 보조등
            [-0.5, 0, 0.5].forEach(x => box(0.3, 0.2, 0.15, CARMAT.head, x, top + ch + 0.3, cz - cl / 2 + 0.3));
            mirrors(cz - cl / 2 + 0.2, top + 0.4);
        }
        else if (type === 'pony') {
            // 경량 해치백 (점프 +1): 둥글고 통통한 실루엣 + 흰색 투톤 지붕 + 레이싱 스트라이프 + 스포일러
            const cl = 2.5, ch = 0.8, cz = 0.55;
            box(bw * 0.86, ch, cl, CARMAT.glass, 0, top + ch / 2, cz);                         // 유리 캐빈
            [-1, 1].forEach(sd => box(0.08, ch, 0.12, paint, sd * bw * 0.43, top + ch / 2, cz - cl / 2 + 0.06)); // A필러
            box(bw * 0.88, 0.1, cl - 0.1, CARMAT.white, 0, top + ch + 0.05, cz);               // 흰 지붕
            box(bw * 0.86, 0.08, 0.45, accent, 0, top + ch + 0.05, cz + cl / 2 - 0.05);         // 지붕 끝 스포일러
            [-0.25, 0.25].forEach(x => {                                                        // 레이싱 스트라이프
                box(0.22, 0.02, bl * 0.48, accent, x, top + 0.01, front + bl * 0.24);
            });
            // 스프링 감성: 동글동글한 큰 헤드램프
            [-1, 1].forEach(sd => {
                const hl = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.08, 14), CARMAT.head);
                hl.rotation.x = Math.PI / 2; hl.position.set(sd * (bw / 2 - 0.4), cy + 0.15, front - 0.05); car.add(hl);
            });
            // 안테나 + 지붕 위 작은 점프 스프링 장식
            box(0.03, 0.6, 0.03, CARMAT.black, -bw * 0.3, top + ch + 0.35, cz + 0.6);
            const ball = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), accent); ball.position.set(-bw * 0.3, top + ch + 0.68, cz + 0.6); car.add(ball);
            mirrors(cz - cl / 2 + 0.25, top + 0.3);
        }
        else if (type === 'sonata') {
            // 드리프트 머신 (이동 3배): 낮고 넓은 바디킷 + 대형 윙 + 사이드 스커트 + 보라 네온 언더글로우
            const cl = 1.9, ch = 0.5, cz = 0.25;
            box(bw * 0.72, ch, cl, CARMAT.glass, 0, top + ch / 2, cz);
            box(bw * 0.74, 0.06, cl * 0.75, paint, 0, top + ch + 0.02, cz + 0.1);              // 지붕
            // 와이드 펜더
            [-1, 1].forEach(sd => [axle, -axle].forEach(z => box(0.22, bh + 0.15, 1.5, paint, sd * (bw / 2 + 0.06), cy + 0.05, z)));
            // 프론트 립 + 사이드 스커트 + 디퓨저 (검정 카본)
            box(bw * 1.04, 0.06, 0.4, CARMAT.black, 0, cy - bh / 2 - 0.02, front - 0.15);
            [-1, 1].forEach(sd => box(0.12, 0.12, bl * 0.45, CARMAT.black, sd * (bw / 2 + 0.12), cy - bh / 2 + 0.04, 0));
            [-0.6, -0.2, 0.2, 0.6].forEach(x => box(0.06, 0.25, 0.4, CARMAT.black, x, cy - bh / 2 + 0.05, back - 0.1));
            // 대형 리어 윙 + 엔드플레이트
            box(bw * 1.05, 0.08, 0.7, CARMAT.black, 0, top + 0.75, back - 0.35);
            [-1, 1].forEach(sd => {
                box(0.06, 0.35, 0.8, CARMAT.black, sd * bw * 0.52, top + 0.68, back - 0.35);
                box(0.08, 0.7, 0.18, CARMAT.black, sd * bw * 0.32, top + 0.35, back - 0.35);
            });
            // 보닛 에어벤트 + 레이싱 넘버
            box(0.8, 0.04, 0.6, CARMAT.black, 0, top + 0.02, front + 0.8);
            box(0.03, 0.5, 0.5, CARMAT.white, bw / 2 + 0.18, cy + 0.02, 0);                    // 사이드 넘버 판
            box(0.03, 0.5, 0.5, CARMAT.white, -bw / 2 - 0.18, cy + 0.02, 0);
            // 쌍 머플러 (주황 불꽃 느낌 팁)
            [-0.35, 0.35].forEach(x => {
                const ex = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 0.35, 10), CARMAT.chrome);
                ex.rotation.x = Math.PI / 2; ex.position.set(x, cy - bh / 2 + 0.1, back + 0.12); car.add(ex);
                const fl = new THREE.Mesh(new THREE.CircleGeometry(0.08, 10), CARMAT.orange); fl.position.set(x, cy - bh / 2 + 0.1, back + 0.3); car.add(fl);
            });
            // 네온 언더글로우
            const glow = new THREE.Mesh(new THREE.PlaneGeometry(bw + 0.8, bl + 0.6), CARMAT.neonPurple);
            glow.rotation.x = -Math.PI / 2; glow.position.y = 0.03; car.add(glow);
            mirrors(cz - cl / 2 + 0.15, top + 0.25);
        }
        else if (type === 'grandeur') {
            // 타임 컨트롤러 (시간 감속): 미래형 고급 세단 + 시안 네온 라인 + 보닛 위 시계 엠블럼
            const cl = 2.7, ch = 0.66, cz = 0.15;
            box(bw * 0.82, ch, cl, CARMAT.glass, 0, top + ch / 2, cz);
            box(bw * 0.84, 0.06, cl * 0.8, paint, 0, top + ch + 0.02, cz);
            // 전면/후면 일자형 라이트바 (시안)
            box(bw * 0.95, 0.07, 0.06, CARMAT.neonCyan, 0, cy + bh * 0.35, front - 0.04);
            box(bw * 0.95, 0.1, 0.06, CARMAT.tail, 0, cy + bh * 0.3, back + 0.04);
            box(bw * 0.55, bh * 0.5, 0.05, CARMAT.chrome, 0, cy - 0.05, front - 0.04);          // 크롬 그릴
            // 차체 측면 네온 라인 + 휠 주변 시안 링
            [-1, 1].forEach(sd => {
                box(0.03, 0.05, bl * 0.9, CARMAT.neonCyan, sd * (bw / 2 + 0.01), cy + bh * 0.1, 0);
                [axle, -axle].forEach(z => {
                    const ring = new THREE.Mesh(new THREE.TorusGeometry(wr * 0.62, 0.03, 6, 20), CARMAT.neonCyan);
                    ring.rotation.y = Math.PI / 2; ring.position.set(sd * (bw / 2 + 0.01), wr, z); car.add(ring);
                });
            });
            // 보닛 위 시계 엠블럼 (링 + 시침/분침)
            const clock = new THREE.Group();
            const face = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.04, 8, 24), CARMAT.gold); clock.add(face);
            const h1 = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.22, 0.02), CARMAT.gold); h1.position.y = 0.1; clock.add(h1);
            const h2 = new THREE.Mesh(new THREE.BoxGeometry(0.16, 0.04, 0.02), CARMAT.gold); h2.position.x = 0.07; clock.add(h2);
            clock.rotation.x = -Math.PI / 2; clock.position.set(0, top + 0.02, front + 0.8); car.add(clock);
            // 트렁크 위 작은 시안 스포일러 립 + 은은한 하부 글로우
            box(bw * 0.8, 0.05, 0.25, CARMAT.neonCyan, 0, top + 0.03, back - 0.15);
            const glow = new THREE.Mesh(new THREE.PlaneGeometry(bw + 0.4, bl + 0.2), CARMAT.neonCyanGlow);
            glow.rotation.x = -Math.PI / 2; glow.position.y = 0.03; car.add(glow);
            mirrors(cz - cl / 2 + 0.2, top + 0.25);
        }
        return { mesh: car, width: bw, length: bl };
    }

    const carTemplates = {};
    // 액센트 색 (차체색과 어울리는 포인트 컬러)
    const ACCENT_COLOR = { roadster: 0xf5c542, santafe: 0x111111, pony: 0xffffff, sonata: 0x111111, grandeur: 0x22d3ee };

    function createCarMesh(type, colorHex) {
        if (!carTemplates[type]) carTemplates[type] = buildCarTemplate(type);
        const tpl = carTemplates[type];
        const paintMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.35, roughness: 0.3 });
        const accentMat = new THREE.MeshStandardMaterial({ color: (ACCENT_COLOR[type] !== undefined ? ACCENT_COLOR[type] : 0xffffff), metalness: 0.3, roughness: 0.4 });
        const mesh = tpl.mesh.clone(); // 지오메트리 공유
        mesh.traverse(o => {
            if (!o.isMesh) return;
            if (o.material === PAINT_PLACEHOLDER) o.material = paintMat;
            else if (o.material === ACCENT_PLACEHOLDER) o.material = accentMat;
        });
        return { mesh, width: tpl.width, length: tpl.length };
    }

    /* ==========================================
       4. 게임 상태 및 핵심 로직
       ========================================== */
    let gameState = 'LOBBY';
    let gameTime = 0;
    let score = 0;
    let lastTime = performance.now();
    const COUNT_STEP = 0.5;   // 숫자 하나당 0.5초 (빠른 카운트)
    let countdownTimer = 0, countdownStep = -1;

    function showCount(text, color) {
        const el = document.getElementById('countText');
        el.textContent = text;
        el.style.color = color;

    function updateCountdown(realDt) {

        if (step !== countdownStep) {
            countdownStep = step;
            if (step < 3) showCount(String(3 - step), ['#f87171', '#fbbf24', '#34d399'][step]);
            else if (step === 3) {

                gameState = 'PLAYING';
                document.getElementById('controls').classList.remove('hidden');
                playMusic(selectedTheme); // 출발과 동시에 코스별 배경음악

    function makeTextTexture(text, opts = {}) {
        const w = opts.w || 512, h = opts.h || 128;
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const g = c.getContext('2d');
        g.fillStyle = opts.bg || '#111'; g.fillRect(0, 0, w, h);
        if (opts.border) { g.strokeStyle = opts.border; g.lineWidth = 8; g.strokeRect(4, 4, w - 8, h - 8); }
        g.fillStyle = opts.color || '#fff';
        g.font = `900 ${opts.size || 64}px 'Inter', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif`;
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillText(text, w / 2, h / 2 + 4);
        return new THREE.CanvasTexture(c);
    }
    function makeClockTexture(hour, minute) {
        const c = document.createElement('canvas'); c.width = c.height = 256;
        const g = c.getContext('2d');
        g.fillStyle = '#fdfaf2'; g.beginPath(); g.arc(128, 128, 120, 0, Math.PI * 2); g.fill();
        g.lineWidth = 10; g.strokeStyle = '#1f2937'; g.stroke();
        g.fillStyle = '#1f2937';
        for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; g.fillRect(128 + Math.sin(a) * 96 - 4, 128 - Math.cos(a) * 96 - 10, 8, 20); }
        const hand = (ang, len, wid, col) => { g.save(); g.translate(128, 128); g.rotate(ang); g.fillStyle = col; g.fillRect(-wid / 2, -len, wid, len + 12); g.restore(); };
        hand((hour % 12 + minute / 60) * Math.PI / 6, 62, 12, '#1f2937');
        hand(minute * Math.PI / 30, 92, 7, '#1f2937');
        g.fillStyle = '#dc2626'; g.beginPath(); g.arc(128, 128, 10, 0, Math.PI * 2); g.fill();
        return new THREE.CanvasTexture(c);
    }
    const std = (color, extra = {}) => new THREE.MeshStandardMaterial(Object.assign({ color }, extra));
    function addBox(parent, w, h, d, mat, x, y, z) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m;
    }

        addBox(g, 40, 9, 18, stone, 0, 4.5, -9);

        [-14, 14].forEach(x => { addBox(g, 8, 1, 3, stone, x, 0.7, 12); addBox(g, 7.4, 0.8, 2.4, std(0x3f8f3f), x, 1.4, 12); });

    // ---- 퇴근길: 우리집 (2층 단독주택) ----
    function buildHouse() {
        const g = new THREE.Group();

        const wood = std(0x6b4226);

        addBox(g, 5, 0.25, 14, std(0xc9c2b5), 0, 0.15, 10);

        const roof = new THREE.Mesh(new THREE.ExtrudeGeometry(roofShape, { depth: D + 2, bevelEnabled: false }), roofMat);
        roof.position.set(0, H, -7 - (D + 2) / 2); g.add(roof);

        const gableShape = new THREE.Shape(); gableShape.moveTo(-W / 2, 0); gableShape.lineTo(W / 2, 0); gableShape.lineTo(0, 6); gableShape.lineTo(-W / 2, 0);
        const gable = new THREE.Mesh(new THREE.ShapeGeometry(gableShape), wall); gable.position.set(0, H, -7 + D / 2 + 0.02); g.add(gable);
        const atticWin = new THREE.Mesh(new THREE.CircleGeometry(1.2, 20), lit); atticWin.position.set(0, H + 2.4, -7 + D / 2 + 0.05); g.add(atticWin);
        // 굴뚝

        // 창문 (불 켜짐) + 창틀 + 덧문

            addBox(g, 2.6, 2.6, 0.35, lit, x, y, -7 + D / 2 + 0.08);

        };
        [-7, 7].forEach(x => { win(x, 3.6); win(x, 9.8); }); win(0, 9.8);
        // 현관: 문 + 손잡이 + 포치 지붕 + 기둥 + 계단 + 현관등

        const knob = new THREE.Mesh(new THREE.SphereGeometry(0.15, 8, 6), std(0xd4af37, { metalness: 1 })); knob.position.set(1, 2.8, -7 + D / 2 + 0.4); g.add(knob);
        addBox(g, 8, 0.5, 4, trim, 0, 6, -7 + D / 2 + 2);
        [-3.6, 3.6].forEach(x => addBox(g, 0.4, 5.6, 0.4, trim, x, 3, -7 + D / 2 + 3.7));

        const porchLight = new THREE.Mesh(new THREE.SphereGeometry(0.35, 10, 8), new THREE.MeshBasicMaterial({ color: 0xffe2a8 })); porchLight.position.set(2.3, 4.8, -7 + D / 2 + 0.4); g.add(porchLight);
        const pl = new THREE.PointLight(0xffb85c, 1.2, 18); pl.position.set(0, 4.5, -7 + D / 2 + 2); g.add(pl);
        // 차고 (옆 건물)
        addBox(g, 10, 7, 12, wall, -16, 3.5, -6);
